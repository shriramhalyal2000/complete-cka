kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
nodes:
# -----------------------------------------------------------------------------
# Control Plane Node (Pure Control Plane - No App/Ingress Pods)
# -----------------------------------------------------------------------------
- role: control-plane

# -----------------------------------------------------------------------------
# Worker Node 1 (Hosts Ingress Controller + App Pods)
# -----------------------------------------------------------------------------
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP

# -----------------------------------------------------------------------------
# Worker Nodes 2 & 3 (App Workloads)
# -----------------------------------------------------------------------------
- role: worker
- role: worker