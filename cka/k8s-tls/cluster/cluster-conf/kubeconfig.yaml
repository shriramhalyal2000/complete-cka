apiVersion: v1
kind: Config

preference: {}

clusters:
- cluster:
  name: dev
- cluster:
  name: prod

users:
- name: admin
- name: dev1
- name: dev2

contexts:
- context:
   cluster: dev
   user: dev1
  name: dev1-dev # user+cluster name concat this user can only access this cluster
- context:
   cluster: prod
   user: dev2
  name: dev2-dev # this user can only access this cluster
# admin user has comple access on all clusters 
- context:
   cluster: dev
   user: admin
  name: admin-dev
- context:
   cluster: prod
   user: admin
  name: admin-prod 
# can add client certificate data and client certificate key data too so user is pre-authorised to access cluster