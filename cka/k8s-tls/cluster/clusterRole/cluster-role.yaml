apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metatdata:
  name: admin-cluster-role
rules: # add as many resouces you want the cluster role should have to bind it to a user
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["create", "delete", "watch", "list", "get"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["create", "delete", "watch", "list", "get"]
- apiGroups: [""]
  resources: ["storageclasses"]
  verbs: ["create", "delete", "watch", "list", "get"]
---
apiVersion:  rbac.authorization.k8s.io/v1
kind: CLusterRoleBinding
metadata:
  name: admin-cluster-role-binding
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: cluster-admin # any user that cluster role should be binded with
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-cluster-role # bind the Cluster role created with user