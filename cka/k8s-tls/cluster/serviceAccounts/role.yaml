apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: service-ac-admin-rl
rules:
- apigroups: [""]
  resources: ["nodes", "persistentstoragevolumes", "storageclasses", "services", "nodes", "pods", "deployment", "secrets", "configmaps", "namespaces"]
  verbs: ["create", "get", "list", "delete", "describe", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sc-cluster-role-binding
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: ServiceAccount
  name: aws-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: service-ac-admin-rl