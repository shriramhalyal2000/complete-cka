apiVersion: v1
kind: ServiceAccount
metadata:
  name: depl-service-account
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: depl-service-account-role
rules:
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["create", "get", "list", "delete", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: depl-service-account-role-binding
subjects:
- apiGroup: ""
  kind: ServiceAccount
  name: depl-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: CLusterRole
  name: depl-service-account-role